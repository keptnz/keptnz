name: Refresh Kept catalogue

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch the latest products from NZ stores
        run: python3 scripts/fetch_products.py

      - name: Publish if the catalogue changed
        run: |
          git config user.name  "Kept catalogue bot"
          git config user.email "actions@github.com"
          git add products.json
          if git diff --staged --quiet; then
            echo "No changes today."
          else
            git commit -m "Catalogue refresh $(date -u +'%Y-%m-%d')"
            git push
          fi
