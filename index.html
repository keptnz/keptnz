<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F3F0E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kept">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Swipe, save and buy from New Zealand's best stores — all in one place. Skip what you don't like once, and never see it again.">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Kept — Shop New Zealand stores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F0E9; --card:#EAE3D6; --imgbg:#E7E0D3; --ink:#2b2822; --soft:#8f8a7c; --line:#E0D9CB;
  --olive:#6d7153; --olive-d:#5c603f; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overscroll-behavior:none;}
body{position:fixed;inset:0;}
.app{display:flex;flex-direction:column;height:100%;max-width:500px;margin:0 auto;position:relative;background:var(--paper);}
@media(min-width:501px){.app{box-shadow:0 0 70px rgba(0,0,0,.09);}}
.serif{font-family:'Fraunces',Georgia,serif;}

header{padding:calc(12px + var(--safe-t)) 20px 8px;display:flex;align-items:flex-start;justify-content:space-between;flex:none;}
.logo{font-family:'Fraunces',serif;font-weight:600;font-size:27px;letter-spacing:5px;line-height:1;text-transform:uppercase;}
.logo small{font-family:'Inter';font-weight:500;font-size:10px;color:var(--soft);text-transform:none;display:block;margin-top:5px;letter-spacing:.2px;}
.hicons{display:flex;gap:4px;padding-top:4px;}
.iconbtn{width:38px;height:38px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;cursor:pointer;position:relative;}
.iconbtn svg{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:1.7;}
.iconbtn.on{background:var(--olive);}
.iconbtn.on svg{stroke:#fff;}

.filters{display:flex;gap:8px;overflow-x:auto;padding:8px 20px 12px;flex:none;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.pill{flex:none;border:none;background:#E7E1D4;color:#6a655a;padding:8px 16px;border-radius:100px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:.16s;}
.pill.active{background:var(--ink);color:var(--paper);}
.searchbar{display:none;padding:0 20px 10px;flex:none;}
.searchbar.show{display:block;}
.searchbar input{width:100%;border:1px solid var(--line);background:#fff;border-radius:100px;padding:11px 18px;font-size:15px;font-family:inherit;color:var(--ink);outline:none;}

.stage{flex:1;position:relative;margin:0 20px;min-height:0;}
.card{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:var(--card);box-shadow:0 16px 40px rgba(70,55,35,.15);will-change:transform;user-select:none;display:flex;flex-direction:column;}
.imgwrap{position:relative;flex:1;min-height:0;background:var(--imgbg);overflow:hidden;}
.imgwrap img{width:100%;height:100%;object-fit:contain;object-position:center center;display:block;pointer-events:none;padding:14px 14px 6px;}
.cat-pill{position:absolute;top:15px;left:15px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:rgba(255,255,255,.9);color:var(--ink);padding:7px 13px;border-radius:100px;}
.cat-pill svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:1.7;}
.nz-pill{position:absolute;top:15px;right:15px;font-size:12px;font-weight:600;background:var(--olive);color:#fff;padding:7px 14px;border-radius:100px;}
.cardfoot{flex:none;padding:15px 18px 17px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;background:var(--card);}
.cardfoot .brand{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#9a917c;}
.cardfoot .name{font-family:'Fraunces',serif;font-size:22px;font-weight:500;line-height:1.12;margin:5px 0 4px;}
.cardfoot .sub{font-size:13px;color:var(--soft);margin-bottom:7px;display:flex;align-items:center;gap:5px;}
.cardfoot .sub svg{width:12px;height:12px;stroke:var(--soft);fill:none;stroke-width:1.7;}
.cardfoot .price{font-size:17px;font-weight:600;}
.more{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;margin-bottom:2px;}
.more svg{width:18px;height:18px;fill:var(--ink);}
.stamp{position:absolute;top:26px;padding:6px 16px;border-radius:10px;font-weight:800;font-size:26px;letter-spacing:1px;border:4px solid;opacity:0;transform:rotate(-12deg);pointer-events:none;z-index:5;}
.stamp.like{left:20px;color:var(--olive);border-color:var(--olive);}
.stamp.nope{right:20px;color:#a7a08f;border-color:#a7a08f;transform:rotate(12deg);}

.actions{display:flex;align-items:flex-start;justify-content:space-around;padding:12px 24px 6px;flex:none;}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:var(--soft);font-size:11px;font-weight:500;}
.act .circ{width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 5px 14px rgba(70,55,35,.12);transition:transform .12s;}
.act:active .circ{transform:scale(.9);}
.act svg{width:23px;height:23px;stroke:var(--ink);fill:none;stroke-width:1.9;}
.act.save .circ{width:64px;height:64px;background:var(--olive);box-shadow:0 8px 20px rgba(109,113,83,.4);}
.act.save svg{fill:#fff;stroke:#fff;width:27px;height:27px;}
.act.save{color:var(--olive-d);font-weight:600;}
.act:disabled{opacity:.4;}

.iconrow{display:flex;gap:2px;padding:10px 14px 4px;flex:none;overflow-x:auto;scrollbar-width:none;}
.iconrow::-webkit-scrollbar{display:none;}
.caticon{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;cursor:pointer;color:var(--soft);font-size:10px;font-weight:500;flex:none;min-width:56px;position:relative;}
.caticon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;}
.caticon.active{color:var(--olive-d);}
.caticon.soon{opacity:.5;}
.caticon .soontag{position:absolute;top:-4px;right:6px;font-size:7px;font-weight:700;background:var(--soft);color:#fff;padding:1px 4px;border-radius:6px;letter-spacing:.2px;}
.tagline{text-align:center;font-family:'Fraunces',serif;font-size:13px;color:var(--soft);padding:6px 0 8px;flex:none;display:flex;align-items:center;justify-content:center;gap:6px;}
.tagline svg{width:12px;height:12px;fill:var(--olive);}

nav{display:flex;flex:none;border-top:1px solid var(--line);background:var(--paper);padding-bottom:var(--safe-b);}
nav button{flex:1;border:none;background:none;padding:9px 0 11px;cursor:pointer;color:var(--soft);font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;}
nav button.active{color:var(--ink);}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;}
.navbadge{position:absolute;top:5px;left:50%;margin-left:5px;background:var(--olive);color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:10px;display:grid;place-items:center;padding:0 4px;font-weight:700;}

.sheet{flex:1;overflow-y:auto;padding:6px 16px 24px;display:none;-webkit-overflow-scrolling:touch;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.gitem{background:var(--card);border-radius:16px;overflow:hidden;position:relative;box-shadow:0 6px 16px rgba(70,55,35,.08);}
.gitem a{text-decoration:none;color:inherit;display:block;}
.gitem .ph{aspect-ratio:3/4;overflow:hidden;background:var(--imgbg);}
.gitem img{width:100%;height:100%;object-fit:contain;object-position:center center;display:block;padding:8px;}
.gitem .gi{padding:9px 11px 11px;}
.gitem .gb{font-size:9.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#9a917c;}
.gitem .gn{font-family:'Fraunces',serif;font-size:14px;font-weight:500;margin:3px 0 5px;line-height:1.18;}
.gitem .gp{font-size:13px;font-weight:600;}
.gitem .gnz{display:inline-block;font-size:8px;font-weight:700;color:#fff;background:var(--olive);padding:2px 6px;border-radius:100px;margin-left:4px;vertical-align:middle;}
.gitem .gx{position:absolute;top:7px;right:7px;height:28px;padding:0 10px;border-radius:100px;border:none;background:rgba(43,40,34,.82);color:#fff;display:flex;align-items:center;gap:4px;cursor:pointer;font-size:11px;font-weight:600;}
.gitem .gx svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.2;}
.gitem .buy{display:block;text-align:center;font-size:11px;font-weight:600;padding:9px;border-top:1px solid var(--line);color:var(--olive-d);}
.sheet h2{font-family:'Fraunces',serif;font-weight:500;font-size:22px;margin:12px 4px 2px;}
.sheet .lead{color:var(--soft);font-size:13px;margin:0 4px 14px;}
.grouphead{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:20px 4px 10px;display:flex;align-items:center;gap:8px;}
.grouphead .n{font-family:'Inter';font-size:11px;font-weight:600;color:var(--soft);background:var(--card);padding:2px 8px;border-radius:100px;}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 30px;color:var(--soft);height:100%;}
.empty h3{font-family:'Fraunces',serif;color:var(--ink);font-size:23px;margin:0 0 8px;font-weight:500;}
.empty p{margin:0 0 18px;font-size:14px;line-height:1.55;max-width:280px;}
.empty .bigicon{width:60px;height:60px;border-radius:18px;background:var(--card);display:grid;place-items:center;margin-bottom:18px;}
.empty .bigicon svg{width:30px;height:30px;stroke:var(--olive-d);fill:none;stroke-width:1.6;}
.btn-primary{border:none;background:var(--olive);color:#fff;padding:12px 24px;border-radius:100px;font-weight:600;font-size:14px;cursor:pointer;}
.btn-ghost{border:1px solid var(--line);background:none;color:var(--ink);padding:11px 22px;border-radius:100px;font-weight:600;font-size:13px;cursor:pointer;}
.stage .empty{position:absolute;inset:0;}

.prow{display:flex;align-items:center;justify-content:space-between;padding:15px 4px;border-bottom:1px solid var(--line);gap:12px;}
.prow .lbl{font-size:15px;font-weight:600;}
.prow .dsc{font-size:12px;color:var(--soft);margin-top:3px;line-height:1.5;}
.switch{width:50px;height:30px;border-radius:100px;background:#d8d1c2;position:relative;cursor:pointer;transition:.18s;flex:none;border:none;}
.switch.on{background:var(--olive);}
.switch .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.18s;}
.switch.on .knob{left:23px;}
.stats{display:flex;gap:10px;margin:6px 0 8px;}
.stat{flex:1;background:var(--card);border-radius:14px;padding:14px;text-align:center;}
.stat b{font-family:'Fraunces',serif;font-size:26px;font-weight:600;display:block;}
.stat span{font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.5px;}
.card-cta{background:var(--olive);color:#fff;border-radius:18px;padding:18px;margin:14px 0;}
.card-cta h4{font-family:'Fraunces',serif;font-weight:500;font-size:18px;margin:0 0 4px;}
.card-cta p{margin:0 0 12px;font-size:13px;opacity:.9;line-height:1.5;}
.inrow{display:flex;gap:8px;}
.inrow input{flex:1;border:none;border-radius:100px;padding:11px 16px;font-size:14px;font-family:inherit;outline:none;}
.inrow button{border:none;background:#fff;color:var(--olive-d);font-weight:700;padding:0 18px;border-radius:100px;cursor:pointer;font-size:14px;}
.linkrow{display:flex;align-items:center;justify-content:space-between;padding:16px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.linkrow .lbl{font-size:15px;font-weight:600;}
.linkrow svg{width:18px;height:18px;stroke:var(--soft);fill:none;stroke-width:2;}

.overlay{position:absolute;inset:0;background:rgba(30,26,20,.5);display:none;align-items:flex-end;z-index:50;}
.overlay.show{display:flex;}
.modal{background:var(--paper);width:100%;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + var(--safe-b));animation:up .25s ease;}
@keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal h3{font-family:'Fraunces',serif;font-weight:500;font-size:21px;margin:0 0 4px;}
.modal p{color:var(--soft);font-size:13px;margin:0 0 14px;line-height:1.5;}
.modal textarea,.modal input{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-size:15px;font-family:inherit;color:var(--ink);outline:none;margin-bottom:10px;}
.modal textarea{min-height:90px;resize:none;}
.modal .mrow{display:flex;gap:10px;}
.modal .mrow button{flex:1;padding:13px;border-radius:100px;font-weight:600;font-size:14px;cursor:pointer;border:none;}
.stars{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
.stars button{background:none;border:none;cursor:pointer;padding:2px;}
.stars svg{width:32px;height:32px;fill:none;stroke:var(--olive);stroke-width:1.6;}
.stars button.on svg{fill:var(--olive);stroke:var(--olive);}
.nearby{color:var(--olive-d);font-weight:500;}
.locgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;}
.locopt{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;cursor:pointer;
  text-align:left;font-size:14px;font-weight:600;font-family:inherit;color:var(--ink);}
.locopt span{display:block;font-size:11px;font-weight:500;color:var(--soft);margin-top:2px;}
.locopt.sel{background:var(--olive);border-color:var(--olive);color:#fff;}
.locopt.sel span{color:rgba(255,255,255,.85);}
.locsubs{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.locsublabel{width:100%;font-size:12px;font-weight:600;color:var(--soft);margin-bottom:2px;}
.modal{max-height:82vh;overflow-y:auto;}
</style>
</head>
<body>
<!-- hidden static forms so Netlify detects them on deploy -->
<form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden><input name="email"/><input name="rating"/><textarea name="message"></textarea><input name="bot-field"/></form>
<form name="analytics" data-netlify="true" netlify-honeypot="bot-field" hidden><input name="session"/><input name="summary"/><input name="top_saved"/><input name="referrer"/><input name="bot-field"/></form>

<div class="app">
  <header>
    <div class="logo">Kept<small>Shop New Zealand stores</small></div>
    <div class="hicons">
      <button class="iconbtn" id="searchBtn" title="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
      <button class="iconbtn" id="locBtn" title="Shop near me"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg></button>
      <button class="iconbtn" id="nzBtn" title="NZ designers only"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
    </div>
  </header>

  <div class="filters" id="filters"></div>
  <div class="searchbar" id="searchbar"><input id="searchInput" placeholder="Search brand or piece…" autocomplete="off"></div>

  <div id="discoverView" style="display:flex;flex-direction:column;flex:1;min-height:0;">
    <div class="stage" id="stage"></div>
    <div class="actions" id="actionsBar">
      <button class="act" id="undoBtn" disabled><span class="circ"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></svg></span>Undo</button>
      <button class="act" id="nopeBtn"><span class="circ"><svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span>Skip</button>
      <button class="act save" id="likeBtn"><span class="circ"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg></span>Save</button>
      <button class="act" id="openBtn"><span class="circ"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>View</button>
    </div>
    <div class="iconrow" id="iconrow"></div>
    <div class="tagline"><svg viewBox="0 0 24 24"><path d="M12 2c-1 5-4 7-8 8 4 1 7 3 8 12 1-9 4-11 8-12-4-1-7-3-8-8Z"/></svg>Curated. Considered. Kept.</div>
  </div>

  <div class="sheet" id="savedView"></div>
  <div class="sheet" id="matchView"></div>
  <div class="sheet" id="profileView"></div>

  <nav>
    <button id="tabdiscover" class="active" onclick="setTab('discover')"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 5-4 2 2-5 4-2Z"/></svg>Discover</button>
    <button id="tabsaved" onclick="setTab('saved')"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>Saved<span class="navbadge" id="navBadge" style="display:none;">0</span></button>
    <button id="tabmatches" onclick="setTab('matches')"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-3.5 3 1 4.8L12 14.6 8 16.8l1-4.8L5.5 9l4.6-1.4L12 3Z"/></svg>Matches</button>
    <button id="tabprofile" onclick="setTab('profile')"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</button>
  </nav>

  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
</div>

// Pull the freshest catalogue if we're served from a real URL (the data engine refreshes this daily).
async function loadLiveCatalogue(){
  try{
    const r=await fetch('products.json?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const d=await r.json();
    const items=Array.isArray(d)?d:d.items;
    if(Array.isArray(items)&&items.length){PRODUCTS=items;CATALOGUE_UPDATED=(d&&d.updated)||null;}
  }catch(e){/* offline or single-file use — keep the built-in snapshot */}
}

(function bootAnalytics(){

    s.src='https://plausible.io/js/script.js';document.head.appendChild(s);

function track(name,params){
  AN.counts[name]=(AN.counts[name]||0)+1;
  AN.session[name]=(AN.session[name]||0)+1;
  AN.events++;store.set('kept_an',AN.counts);
  try{ if(window.plausible)window.plausible(name,{props:params||{}}); }catch(e){}
  try{ if(window.gtag)window.gtag('event',name,params||{}); }catch(e){}
}
function sessionId(){let s=store.get('kept_sid');if(!s){s=Math.random().toString(36).slice(2,10);store.set('kept_sid',s);}return s;}
let summarySent=false;
function sendSessionSummary(){
  if(summarySent||!ANALYTICS.sendSessionSummary||AN.events<4)return;summarySent=true;
  const savedItems=PRODUCTS.filter(p=>liked.has(id(p))).slice(0,15).map(p=>`${p.brand} — ${p.title} ($${p.price})`);
  const mins=Math.round((Date.now()-AN.started)/6000)/10;
  const body=new URLSearchParams({'form-name':'analytics',session:sessionId(),
    summary:JSON.stringify(Object.assign({minutes:mins,saved:liked.size,skipped:disliked.size},AN.session)),
    top_saved:savedItems.join(' | '),referrer:document.referrer||'direct'}).toString();
  try{navigator.sendBeacon('/',new Blob([body],{type:'application/x-www-form-urlencoded'}));}
  catch(e){fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body,keepalive:true}).catch(()=>{});}
}
window.addEventListener('pagehide',sendSessionSummary);

function storeLocs(p){ return STORE_LOCATIONS[p.store] || []; }
function nearHere(p){
  if(!activeCity) return true;
  return storeLocs(p).some(([c,s])=> c===activeCity && (!activeSuburb || s===activeSuburb));

let activeCity=store.get('kept_city')||'', activeSuburb=store.get('kept_suburb')||'';

let activeDept='Clothing', activeSub='All', showSoon=null, nzOnly=store.get('kept_nzonly')||false, searchTerm='', deck=[], history=[];
const id=p=>p.url;
function available(p){return !liked.has(id(p))&&!disliked.has(id(p));}
function inScope(p){return available(p)&&(!nzOnly||p.nz)&&nearHere(p);}
function matchSearch(p){if(!searchTerm)return true;return (p.title+' '+p.brand+' '+p.store).toLowerCase().includes(searchTerm);}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
function deptCount(d){return PRODUCTS.filter(p=>inScope(p)&&macro(p.cat)===d).length;}
function subCount(sub){return PRODUCTS.filter(p=>inScope(p)&&macro(p.cat)==='Clothing'&&(sub==='All'||p.cat===sub)).length;}

function buildDeck(){
  deck=PRODUCTS.filter(p=>inScope(p)&&macro(p.cat)===activeDept&&matchSearch(p)&&(activeDept!=='Clothing'||activeSub==='All'||p.cat===activeSub));
  deck.sort((a,b)=>{if(a.nz!==b.nz)return a.nz?-1:1;return (hash(id(a))%1000)-(hash(id(b))%1000);});
}

function renderFilters(){
  const f=document.getElementById('filters');
  if(activeDept==='Clothing'&&!showSoon){
    f.style.display='flex';f.innerHTML='';
    CLOTHING_SUBS.forEach(s=>{if(s!=='All'&&subCount(s)===0)return;
      const b=document.createElement('button');b.className='pill'+(s===activeSub?' active':'');b.textContent=s;
      b.onclick=()=>{activeSub=s;buildDeck();renderFilters();renderDeck();};f.appendChild(b);});
  } else f.style.display='none';
  const ir=document.getElementById('iconrow');ir.innerHTML='';
  DEPTS.forEach(d=>{
    const b=document.createElement('button');
    const act=(showSoon===d.k)||(!showSoon&&d.live&&activeDept===d.k);
    b.className='caticon'+(act?' active':'')+(d.live?'':' soon');
    b.innerHTML=CATSVG(d.k)+d.k+(d.live?'':'<span class="soontag">soon</span>');
    b.onclick=()=>{
      if(d.live){showSoon=null;activeDept=d.k;activeSub='All';track('department',{name:d.k});buildDeck();renderFilters();renderDeck();}
      else{showSoon=d.k;track('coming_soon_interest',{name:d.k});renderFilters();renderDeck();}
    };
    ir.appendChild(b);
  });
  document.getElementById('nzBtn').classList.toggle('on',nzOnly);
  document.getElementById('locBtn').classList.toggle('on',!!activeCity);
}

function locLine(p){

    const here=L.filter(([c,s])=>c===activeCity&&(!activeSuburb||s===activeSuburb)).map(x=>x[1]);
    if(here.length) return ` <span class="nearby">· in store ${esc(here.slice(0,2).join(', '))}</span>`;
  }
  return ` <span class="nearby">· ${L.length} store${L.length>1?'s':''}</span>`;
}
function renderDeck(){
  stage.innerHTML='';updateCounts();
  const ab=document.getElementById('actionsBar');
  if(showSoon){
    ab.style.visibility='hidden';
    stage.innerHTML=`<div class="empty"><div class="bigicon">${CATSVG(showSoon)}</div>
      <h3>${showSoon} — coming soon</h3><p>We're starting with fashion. ${showSoon} from NZ stores is on the way — want it sooner? Tell us in the app.</p>
      <button class="btn-primary" onclick="goBackDept()">← Back to shopping</button></div>`;
    return;
  }
  ab.style.visibility='visible';
  if(deck.length===0){
    ab.style.visibility='hidden';
    stage.innerHTML=`<div class="empty"><div class="bigicon">${CATSVG(activeDept)}</div><h3>That's everything${activeSub!=='All'&&activeDept==='Clothing'?' in '+activeSub:' in '+activeDept}</h3>
      <p>${activeCity?`Nothing left from brands with a store in ${esc(activeSuburb||activeCity)} — try a wider area, or `:''}${nzOnly?'turn off NZ-only to see more, or ':''}reset skipped to go again.</p>
      ${activeCity?`<button class="btn-ghost" style="margin-bottom:10px" onclick="clearLocation()">Show all of New Zealand</button><br>`:''}
      <button class="btn-ghost" onclick="resetSkipped()">Reset skipped</button></div>`;
    setControls(false);return;
  }
  setControls(true);
  const show=deck.slice(0,Math.min(3,deck.length));
  for(let i=show.length-1;i>=0;i--){
    const p=show[i],c=document.createElement('div');c.className='card';c.innerHTML=cardHTML(p);
    c.style.transform=`scale(${1-i*0.035}) translateY(${i*8}px)`;c.style.zIndex=100-i;
    c.style.transition='transform .28s cubic-bezier(.2,.7,.3,1)';stage.appendChild(c);
    if(i===0)attachDrag(c,p);
  }
  deck.slice(3,6).forEach(p=>{const im=new Image();im.src=p.img;});
}
function goBackDept(){showSoon=null;renderFilters();renderDeck();}
function setControls(on){['nopeBtn','likeBtn','openBtn'].forEach(b=>document.getElementById(b).disabled=!on);
  document.getElementById('undoBtn').disabled=history.length===0;}
function updateCounts(){const nb=document.getElementById('navBadge');
  if(liked.size>0){nb.style.display='grid';nb.textContent=liked.size;}else{nb.style.display='none';}}

function attachDrag(card,p){
  let sx=0,sy=0,dx=0,dy=0,drag=false;
  const L=card.querySelector('.stamp.like'),N=card.querySelector('.stamp.nope');
  const down=e=>{drag=true;const t=pt(e);sx=t.x;sy=t.y;card.style.transition='none';};
  const move=e=>{if(!drag)return;const t=pt(e);dx=t.x-sx;dy=t.y-sy;
    card.style.transform=`translate(${dx}px,${dy}px) rotate(${dx*0.05}deg)`;
    const r=Math.min(Math.abs(dx)/110,1);L.style.opacity=dx>0?r:0;N.style.opacity=dx<0?r:0;
    if(Math.abs(dx)>6&&e.cancelable)e.preventDefault();};
  const up=()=>{if(!drag)return;drag=false;card.style.transition='transform .3s ease';
    if(dx>100)fling(card,1,p);else if(dx<-100)fling(card,-1,p);
    else{card.style.transform='';L.style.opacity=0;N.style.opacity=0;}dx=dy=0;};
  card.addEventListener('pointerdown',down);card.addEventListener('pointermove',move,{passive:false});
  card.addEventListener('pointerup',up);card.addEventListener('pointercancel',up);card.addEventListener('pointerleave',up);
}
function pt(e){return{x:e.clientX,y:e.clientY};}
function fling(card,dir,p){card.style.transform=`translate(${dir*620}px,-30px) rotate(${dir*20}deg)`;card.style.opacity='0';commit(p,dir>0);setTimeout(renderDeck,180);}
function commit(p,isLike){if(isLike)liked.add(id(p));else disliked.add(id(p));history.push({url:id(p),like:isLike});deck=deck.filter(x=>id(x)!==id(p));persist();
  track(isLike?'save':'skip',{brand:p.brand,store:p.store,category:p.cat,price:p.price});}
/* Always open the retailer in a separate tab so Kept is never navigated away from.
   Using a real anchor is more reliable than window.open inside installed web apps. */
function goToStore(url,where){
  track('click_through',{where:where||'card',url});
  try{
    const a=document.createElement('a');
    a.href=url;a.target='_blank';a.rel='noopener noreferrer';
    document.body.appendChild(a);a.click();a.remove();
  }catch(e){ window.open(url,'_blank','noopener'); }
}
function programmatic(dir){const top=stage.querySelector('.card'),p=deck[0];if(!top||!p)return;top.style.transition='transform .32s ease, opacity .32s ease';fling(top,dir,p);}
document.getElementById('nopeBtn').onclick=()=>programmatic(-1);
document.getElementById('likeBtn').onclick=()=>programmatic(1);
document.getElementById('openBtn').onclick=()=>{const p=deck[0];if(p)goToStore(p.url,'view_button');};
document.getElementById('undoBtn').onclick=()=>{const last=history.pop();if(!last)return;if(last.like)liked.delete(last.url);else disliked.delete(last.url);persist();buildDeck();renderFilters();renderDeck();};
function resetSkipped(){disliked.clear();persist();buildDeck();renderFilters();renderDeck();}

document.getElementById('searchBtn').onclick=()=>{const sb=document.getElementById('searchbar');const show=sb.classList.toggle('show');
  document.getElementById('searchBtn').classList.toggle('on',show);
  if(show)document.getElementById('searchInput').focus();else{searchTerm='';document.getElementById('searchInput').value='';buildDeck();renderDeck();}};
let stimer=null;
document.getElementById('searchInput').addEventListener('input',e=>{searchTerm=e.target.value.trim().toLowerCase();buildDeck();renderDeck();
  clearTimeout(stimer);if(searchTerm.length>2)stimer=setTimeout(()=>track('search',{term:searchTerm}),900);});
document.getElementById('nzBtn').onclick=()=>{nzOnly=!nzOnly;store.set('kept_nzonly',nzOnly);
  if(deptCount(activeDept)===0)activeDept='Clothing';buildDeck();renderFilters();renderDeck();};

/* saved (grouped by department) */
function gitemHTML(p){return `<div class="gitem">
  <button class="gx" onclick="unsave('${jsesc(id(p))}')"><svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>Remove</button>
  <a href="${p.url}" target="_blank" rel="noopener noreferrer" onclick="track('click_through',{where:'saved_tile',brand:'${jsesc(p.brand)}'})"><div class="ph"><img src="${p.img}" loading="lazy" onerror="imgFail(this)"></div>
  <div class="gi"><div class="gb">${esc(p.brand)}${p.nz?'<span class="gnz">NZ</span>':''}</div><div class="gn">${esc(p.title)}</div><div class="gp">$${p.price}</div></div></a>
  <a class="buy" href="${p.url}" target="_blank" rel="noopener noreferrer" onclick="track('click_through',{where:'buy_button',store:'${jsesc(p.store)}'})">Buy at ${esc(p.store)} ↗</a></div>`;}
function renderSaved(){
  const v=document.getElementById('savedView');const items=PRODUCTS.filter(p=>liked.has(id(p)));
  if(!items.length){v.innerHTML=`<div class="empty"><div class="bigicon"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg></div><h3>Nothing kept yet</h3><p>Swipe right on pieces you love — they collect here, sorted by category, ready to buy from the NZ store that stocks them.</p><button class="btn-primary" onclick="setTab('discover')">Start swiping</button></div>`;return;}
  const order=['Clothing','Shoes','Bags','Jewellery','Accessories'];
  let h=`<h2>Saved</h2><p class="lead">${items.length} kept piece${items.length>1?'s':''} · tap ✕ to remove, or buy at the store</p>`;
  order.forEach(dep=>{
    const gi=items.filter(p=>macro(p.cat)===dep);
    if(!gi.length)return;
    h+=`<div class="grouphead">${dep}<span class="n">${gi.length}</span></div><div class="grid">${gi.map(gitemHTML).join('')}</div>`;
  });
  v.innerHTML=h;
}
function unsave(u){liked.delete(u);persist();renderSaved();renderFilters();updateCounts();}

/* matches — content-based recommender from saved taste */
function renderMatches(){
  const v=document.getElementById('matchView');
  const likedItems=PRODUCTS.filter(p=>liked.has(id(p)));
  if(!likedItems.length){v.innerHTML=`<div class="empty"><div class="bigicon"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-3.5 3 1 4.8L12 14.6 8 16.8l1-4.8L5.5 9l4.6-1.4L12 3Z"/></svg></div><h3>No matches yet</h3><p>Save a few pieces and Kept learns your taste — then suggests more from the labels, styles and price range you love.</p><button class="btn-primary" onclick="setTab('discover')">Start swiping</button></div>`;return;}
  const brands={},cats={},stores={};let ptot=0;
  likedItems.forEach(p=>{brands[p.brand]=(brands[p.brand]||0)+1;cats[p.cat]=(cats[p.cat]||0)+1;stores[p.store]=(stores[p.store]||0)+1;ptot+=p.price;});
  const avg=ptot/likedItems.length;
  const kw={};likedItems.forEach(p=>p.title.toLowerCase().split(/[^a-z]+/).forEach(w=>{if(w.length>3)kw[w]=(kw[w]||0)+1;}));
  function score(p){let s=0;s+=(brands[p.brand]||0)*3;s+=(cats[p.cat]||0)*2;s+=(stores[p.store]||0)*1;
    s+=Math.max(0,1.5-Math.abs(p.price-avg)/Math.max(avg,1)*1.5);
    p.title.toLowerCase().split(/[^a-z]+/).forEach(w=>{if(kw[w])s+=0.5;});return s;}
  let recs=PRODUCTS.filter(p=>available(p)).map(p=>({p,s:score(p)})).filter(x=>x.s>0);
  recs.sort((a,b)=>b.s-a.s);recs=recs.slice(0,24).map(x=>x.p);
  if(!recs.length){v.innerHTML=`<div class="empty"><div class="bigicon">${CATSVG('Clothing')}</div><h3>All caught up</h3><p>You've seen everything close to your taste for now. Check back as stores add new pieces.</p><button class="btn-primary" onclick="setTab('discover')">Keep swiping</button></div>`;return;}
  const topBrands=Object.keys(brands).sort((a,b)=>brands[b]-brands[a]).slice(0,3).join(', ');
  v.innerHTML=`<h2>Matches for you</h2><p class="lead">Picked from your taste${topBrands?` · you love ${esc(topBrands)}`:''}</p><div class="grid">${recs.map(gitemHTML).join('')}</div>`;
}

/* forms: try Netlify, always save locally + confirm */
function submitForm(name,data){
  const body=new URLSearchParams(Object.assign({'form-name':name},data)).toString();
  const bak=store.get('kept_'+name)||[];bak.push(Object.assign({t:Date.now?0:0},data));store.set('kept_'+name,bak);
  return fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}).catch(()=>{});
}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('overlay').classList.add('show');}
function closeModal(){document.getElementById('overlay').classList.remove('show');}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});

let fbRating=0;
function openFeedback(){
  fbRating=0;
  openModal(`<h3>Share feedback</h3><p>What do you think of Kept? Anything you'd love it to do?</p>
    <div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button onclick="setStars(${n})"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 6 6.5.5-5 4.3 1.6 6.2L12 16.9 5.9 20l1.6-6.2-5-4.3L9 9l3-6Z"/></svg></button>`).join('')}</div>
    <textarea id="fbMsg" placeholder="Your thoughts…"></textarea>
    <input id="fbEmail" type="email" placeholder="Email (optional, if you'd like a reply)">
    <div class="mrow"><button class="btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-primary" style="background:var(--olive)" onclick="sendFeedback()">Send</button></div>`);
}
function setStars(n){fbRating=n;document.querySelectorAll('#stars button').forEach((b,i)=>b.classList.toggle('on',i<n));}
function sendFeedback(){
  const msg=(document.getElementById('fbMsg').value||'').trim();const email=(document.getElementById('fbEmail').value||'').trim();
  if(!msg&&!fbRating){document.getElementById('fbMsg').style.borderColor='#c0392b';return;}
  submitForm('feedback',{rating:String(fbRating),message:msg,email});track('feedback_sent',{rating:fbRating});
  openModal(`<h3>Thank you 💚</h3><p>Your feedback helps shape Kept. We really appreciate it.</p><div class="mrow"><button class="btn-primary" style="background:var(--olive)" onclick="closeModal()">Done</button></div>`);
}

/* location picker */
function openLocation(){
  const cities=citiesList();
  const cityBtns=cities.map(([c,subs])=>`<button class="locopt ${activeCity===c?'sel':''}" onclick="pickCity('${jsesc(c)}')">${esc(c)}<span>${subs.length} area${subs.length>1?'s':''}</span></button>`).join('');
  const subs=activeCity?(cities.find(x=>x[0]===activeCity)||[,[]])[1]:[];
  const subBtns=activeCity?`<div class="locsubs"><div class="locsublabel">Narrow to a suburb</div>
      <button class="pill ${!activeSuburb?'active':''}" onclick="pickSuburb('')">All of ${esc(activeCity)}</button>
      ${subs.map(s=>`<button class="pill ${activeSuburb===s?'active':''}" onclick="pickSuburb('${jsesc(s)}')">${esc(s)}</button>`).join('')}</div>`:'';
  openModal(`<h3>Shop near you</h3><p>Show pieces from brands with a shop you can walk into — handy when you want to try before you buy.</p>
    <div class="locgrid">${cityBtns}</div>${subBtns}
    <p style="font-size:11.5px;margin:14px 0 12px">Shows brands with a store in your area. Stock varies by shop, so it's worth ringing ahead for a specific piece.</p>
    <div class="mrow">${activeCity?`<button class="btn-ghost" onclick="clearLocation();closeModal();">Clear</button>`:''}<button class="btn-primary" style="background:var(--olive)" onclick="closeModal()">Done</button></div>`);
}
function pickCity(c){ activeCity=(activeCity===c?'':c); activeSuburb='';
  store.set('kept_city',activeCity); store.set('kept_suburb','');
  track('location_set',{city:activeCity||'all'});
  if(activeCity&&deptCount(activeDept)===0)activeDept='Clothing';
  buildDeck();renderFilters();renderDeck();openLocation(); }
function pickSuburb(s){ activeSuburb=s; store.set('kept_suburb',s);
  track('location_set',{city:activeCity,suburb:s||'all'});
  buildDeck();renderFilters();renderDeck();openLocation(); }
function clearLocation(){ activeCity='';activeSuburb='';store.set('kept_city','');store.set('kept_suburb','');
  buildDeck();renderFilters();renderDeck(); }
document.getElementById('locBtn').onclick=openLocation;

/* profile */
function renderProfile(){
  const v=document.getElementById('profileView');const seen=liked.size+disliked.size;
  v.innerHTML=`<h2>Profile</h2><p class="lead">Your Kept, on this device</p>
    <div class="stats"><div class="stat"><b>${liked.size}</b><span>Kept</span></div><div class="stat"><b>${disliked.size}</b><span>Skipped</span></div><div class="stat"><b>${seen}</b><span>Seen</span></div></div>
    <div class="card-cta"><h4>Enjoying Kept?</h4><p>Tell us what you think — the good, the bad, and what you'd love it to do next.</p><button class="btn-ghost" style="background:#fff;border:none;color:var(--olive-d);width:100%" onclick="openFeedback()">Share feedback</button></div>
    ${isStandalone()?'':`<div class="linkrow" onclick="addToPhone()"><div><div class="lbl">Add Kept to your phone</div><div class="dsc">Opens like a real app, full screen — and keeps everything you save</div></div><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>`}
    <div class="linkrow" onclick="openFeedback()"><div><div class="lbl">Share feedback</div><div class="dsc">Tell us what you think — it shapes what we build</div></div><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
    <div class="linkrow" onclick="openLocation()"><div><div class="lbl">Shop near you</div><div class="dsc">${activeCity?`Showing brands with a store in ${esc(activeSuburb||activeCity)}`:'All of New Zealand — tap to pick your city or suburb'}</div></div><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
    <div class="prow"><div><div class="lbl">NZ designers only</div><div class="dsc">Every store here is NZ-owned. Flip this on to see only NZ-designed labels.</div></div><button class="switch ${nzOnly?'on':''}" id="pSwitch"><span class="knob"></span></button></div>
    <div class="prow"><div><div class="lbl">Catalogue</div><div class="dsc">${PRODUCTS.length} pieces from ${new Set(PRODUCTS.map(p=>p.store)).size} New Zealand stores${CATALOGUE_UPDATED?` · refreshed ${esc(String(CATALOGUE_UPDATED).slice(0,10))}`:''}</div></div></div>
    <div class="prow"><div><div class="lbl">About Kept</div><div class="dsc">One place to discover across New Zealand's stores — back local businesses, whether the label is a Kiwi designer or a brand they stock. Swipe to keep, tap to buy at the store. Curated. Considered. Kept.</div></div></div>
    <div class="linkrow" onclick="if(confirm('Clear all your kept and skipped items?')){liked.clear();disliked.clear();history=[];persist();buildDeck();renderFilters();renderProfile();updateCounts();}"><div class="lbl" style="color:#b24a3c">Reset everything</div><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></div>`;
  const sw=document.getElementById('pSwitch');
  if(sw)sw.onclick=()=>{nzOnly=!nzOnly;store.set('kept_nzonly',nzOnly);if(deptCount(activeDept)===0)activeDept='Clothing';buildDeck();renderFilters();renderProfile();};
}

function setTab(t){
  const map={discover:'discoverView',saved:'savedView',matches:'matchView',profile:'profileView'};
  Object.entries(map).forEach(([k,vid])=>{document.getElementById(vid).style.display=k===t?(k==='discover'?'flex':'block'):'none';
    document.getElementById('tab'+k).classList.toggle('active',k===t);});
  track('view_'+t);
  if(t==='discover'){buildDeck();renderFilters();renderDeck();}
  else if(t==='saved')renderSaved();else if(t==='matches')renderMatches();else if(t==='profile')renderProfile();
  updateCounts();
}
window.addEventListener('keydown',e=>{if(document.getElementById('discoverView').style.display==='none')return;
  if(e.key==='ArrowRight')programmatic(1);if(e.key==='ArrowLeft')programmatic(-1);});

/* install prompt / add-to-phone */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;});
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
function addToPhone(){
  track('install_prompt_opened');
  if(installEvt){installEvt.prompt();installEvt=null;return;}
  if(isIOS()){
    openModal(`<h3>Add Kept to your phone</h3><p>It'll open like a real app, full screen, and remember everything you save.</p>
      <ol style="color:var(--soft);font-size:14px;line-height:1.9;padding-left:20px;margin:0 0 14px;">
        <li>Tap the <b>Share</b> button at the bottom of Safari <span style="font-size:16px">⎋</span></li>
        <li>Scroll down and tap <b>Add to Home Screen</b></li>
        <li>Tap <b>Add</b> — done ✓</li></ol>
      <div class="mrow"><button class="btn-primary" style="background:var(--olive)" onclick="closeModal()">Got it</button></div>`);
  } else {
    openModal(`<h3>Add Kept to your phone</h3><p>It'll open like a real app and remember everything you save.</p>
      <ol style="color:var(--soft);font-size:14px;line-height:1.9;padding-left:20px;margin:0 0 14px;">
        <li>Tap the <b>⋮</b> menu in your browser</li>
        <li>Tap <b>Install app</b> or <b>Add to Home screen</b></li>
        <li>Confirm — done ✓</li></ol>
      <div class="mrow"><button class="btn-primary" style="background:var(--olive)" onclick="closeModal()">Got it</button></div>`);
  }
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}

loadLiveCatalogue().then(()=>{buildDeck();renderFilters();renderDeck();
  track('app_open',{standalone:isStandalone()?'yes':'no',items:PRODUCTS.length});});
</script>
